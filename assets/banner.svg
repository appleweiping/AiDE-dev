<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#44a8f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80, 60)">
    <rect width="80" height="80" rx="16" fill="url(#accent)" opacity="0.9"/>
    <text x="40" y="58" font-family="monospace" font-size="40" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Ai</text>
  </g>

  <!-- Title -->
  <text x="200" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">AiDE</text>
  <text x="200" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#8892b0">AI Dev Environment</text>

  <!-- Tagline -->
  <text x="200" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4ecdc4">国产大模型驱动的桌面编程 Agent</text>

  <!-- Right side decorative code -->
  <g transform="translate(520, 50)" opacity="0.6">
    <text font-family="monospace" font-size="11" fill="#4ecdc4">const agent = new Agent(provider);</text>
    <text y="20" font-family="monospace" font-size="11" fill="#8892b0">await agent.run("重构这个模块");</text>
    <text y="40" font-family="monospace" font-size="11" fill="#44a8f5">// FileEdit, Bash, Grep, MCP...</text>
    <text y="60" font-family="monospace" font-size="11" fill="#8892b0">agent.on('done', () => {</text>
    <text y="80" font-family="monospace" font-size="11" fill="#4ecdc4">  console.log("✓ 完成");</text>
    <text y="100" font-family="monospace" font-size="11" fill="#8892b0">});</text>
  </g>
</svg>
