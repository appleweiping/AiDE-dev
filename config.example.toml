# AiDE Configuration Example
# Copy this file to ~/.aide/config.toml and edit

[provider]
# Available providers: deepseek, qwen, glm, kimi, doubao, minimax, custom
id = "deepseek"
name = "DeepSeek"
base_url = "https://api.deepseek.com"
api_key = "sk-your-key-here"
model = "deepseek-chat"

[agent]
max_iterations = 50
thinking_enabled = false
thinking_effort = "medium"  # low, medium, high
permission_mode = "safe"    # safe, trusted, locked

[mcp]
# MCP server configurations
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]

# [[mcp.servers]]
# name = "github"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# [mcp.servers.env]
# GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_xxx"

[ui]
language = "zh-CN"  # zh-CN, en
theme = "dark"      # dark, light
font_size = 14
show_token_usage = true
